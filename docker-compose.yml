version: '3.8'

services:

  postgres:
    image: postgres:16
    container_name: katui-postgres

    environment:
      POSTGRES_DB: katui
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5435:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: katui-pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@katui.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "5055:80"

    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: katui-backend

    ports:
      - "8086:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/katui
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
