<div class="sintomas">

    <h2>Sintomas</h2>

    <div class="form-sintoma">

        <input id="localSintoma" type="text" placeholder="Localização do sintoma. Ex: cabeça, barriga, peito">

        <select id="qualidadeSintoma">
            <option value="">Tipo / qualidade</option>
            <option value="Dor latejante">Dor latejante</option>
            <option value="Queimação">Queimação</option>
            <option value="Pressão">Pressão</option>
            <option value="Peso">Peso</option>
            <option value="Coceira">Coceira</option>
            <option value="Formigamento">Formigamento</option>
            <option value="Dormência">Dormência</option>
            <option value="Náusea">Náusea</option>
            <option value="Tontura">Tontura</option>
            <option value="Febre">Febre</option>
            <option value="Outro">Outro</option>
        </select>

        <input id="intensidadeSintoma" type="number" min="0" max="10" placeholder="Intensidade de 0 a 10">

        <select id="incapacitanteSintoma">
            <option value="">Incapacitante?</option>
            <option value="false">Não</option>
            <option value="true">Sim</option>
        </select>

        <input id="padraoTempoSintoma" type="text" placeholder="Tempo/padrão. Ex: começou ontem, vem em crises, dura 30min">

        <input id="fatoresSintoma" type="text" placeholder="O que piora ou melhora? Ex: esforço, repouso, comida">

        <input id="impactoSintoma" type="text" placeholder="Impacto no dia a dia. Ex: atrapalha sono, trabalho, estudos">

        <input id="dataHoraSintoma" type="datetime-local">

        <button id="btnAddSintoma">
            Adicionar
        </button>

    </div>

    <div id="listaSintomas" class="lista-sintomas"></div>

</div>
