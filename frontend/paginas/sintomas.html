<div class="sintomas">

    <h2>Sintomas</h2>

    <div class="form-sintoma">

        <input id="descSintoma" type="text" placeholder="Descreva o sintoma">

        <select id="categoriaSintoma">
            <option value="">Categoria</option>
            <option value="Dor">Dor</option>
            <option value="Febre">Febre</option>
            <option value="Respiratório">Respiratório</option>
            <option value="Outro">Outro</option>
        </select>

        <select id="nivelSintoma">
            <option value="">Intensidade</option>
            <option value="leve">Leve</option>
            <option value="medio">Médio</option>
            <option value="grave">Grave</option>
        </select>

        <input id="dataSintoma" type="datetime-local">

        <select id="tipoSintoma">
            <option value="">Tipo</option>
            <option value="persistente">Persistente</option>
            <option value="passageiro">Passageiro</option>
        </select>

        <button id="btnAddSintoma">
            Adicionar
        </button>

    </div>

    <div id="listaSintomas" class="lista-sintomas"></div>

</div>
