<div class="perfil">

    <h2>Meu Perfil</h2>

    <div id="visualizacao">

        <p><strong>Nome:</strong> <span id="viewNome"></span></p>
        <p><strong>Email:</strong> <span id="viewEmail"></span></p>
        <p><strong>Telefone:</strong> <span id="viewTelefone"></span></p>
        <p><strong>Altura:</strong> <span id="viewAltura"></span></p>
        <p><strong>Peso:</strong> <span id="viewPeso"></span>kg</p>
        <p><strong>Alergias:</strong> <span id="viewAlergias"></span></p>
        <p><strong>Categoria:</strong> <span id="viewCategoria"></span></p>

        <button id="btnEditar">Editar</button>

    </div>

    <div id="edicao" style="display:none;">

        <label>Nome</label>
        <input id="nome" type="text">

        <label>Telefone</label>
        <input id="telefone" type="text">

        <label>Altura</label>
        <input id="altura" type="number">

        <label>Peso</label>
        <input id="peso" type="number">

        <label>Alergias</label>
        <input id="alergias" type="text">

        <br><br>

        <button id="btnSalvar">Salvar</button>

        <button id="btnCancelar">Cancelar</button>

        <p id="msg" style="display:none;color:green;">
             Salvo com sucesso!
        </p>

    </div>

</div>
