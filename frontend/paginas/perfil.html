<div class="perfil">

    <h2>Meu Perfil</h2>

    <div id="visualizacao">

        <p><strong>Nome:</strong> <span id="viewNome"></span></p>
        <p><strong>Email:</strong> <span id="viewEmail"></span></p>
        <p><strong>Telefone:</strong> <span id="viewTelefone"></span></p>

        <div id="areaDadosPaciente">

            <p><strong>Altura:</strong> <span id="viewAltura"></span></p>
            <p><strong>Peso:</strong> <span id="viewPeso"></span>kg</p>
            <p><strong>Alergias:</strong> <span id="viewAlergias"></span></p>

        </div>

        <p><strong>Categoria:</strong> <span id="viewCategoria"></span></p>

        <button id="btnEditar">Editar</button>

    </div>

    <div id="edicao" style="display:none;">

        <label>Nome</label>
        <input id="nome" type="text">

        <label>Telefone</label>
        <input id="telefone" type="text">

        <div id="edicaoDadosPaciente">

            <label>Altura</label>
            <input id="altura" type="number">

            <label>Peso</label>
            <input id="peso" type="number">

            <label>Alergias</label>
            <input id="alergias" type="text">

        </div>

        <br><br>

        <button id="btnSalvar">Salvar</button>

        <button id="btnCancelar">Cancelar</button>

        <p id="msg" style="display:none;color:green;">
             Salvo com sucesso!
        </p>

    </div>

    <hr style="margin: 30px 0; border: none; border-top: 1px solid #ddd;">

    <h3>⚙️ Acessibilidade</h3>

    <div class="acessibilidade-container">

        <div class="acessibilidade-opcao">
            <label for="tamanhoFonte">Tamanho da Fonte:</label>
            <select id="tamanhoFonte" onchange="alterarTamanhFonte()">
                <option value="pequeno">Pequeno</option>
                <option value="normal" selected>Normal</option>
                <option value="grande">Grande</option>
                <option value="extragrande">Extra Grande</option>
            </select>
        </div>

        <div class="acessibilidade-opcao">
            <label for="modoEscuro">
                <input type="checkbox" id="modoEscuro" onchange="alterarModoEscuro()">
                Ativar Modo Escuro
            </label>
        </div>

        <div class="acessibilidade-opcao">
            <label for="fonteDislexia">
                <input type="checkbox" id="fonteDislexia" onchange="alterarFonteDislexia()">
                Usar Fonte Dislexia Friendly
            </label>
        </div>

    </div>

</div>
