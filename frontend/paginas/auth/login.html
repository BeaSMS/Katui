<div class="containerLogin">

    <div class="cardLogin">

        <h2>Login</h2>

        <form class="formLogin">

            <label>Email</label>
            <input id="emailLogin" type="email">

            <label>Senha</label>
            <input id="senhaLogin" type="password">

            <button type="button" onclick="fazerLogin()">
                Entrar
            </button>

            <p class="textoLogin">
                Não possui conta?

                <a href="#"
                   onclick="carregarPagina('paginas/auth/cadastro.html')">

                    Cadastre-se

                </a>
            </p>
        </form>
    </div>
</div>
