<div class="medicamentos">

    <h2>Controle Medicamentoso</h2>

    <div class="form-med">

        <input id="nomeMed" type="text" placeholder="Nome do medicamento">

        <input id="dosagemMed" type="text" placeholder="Dosagem (500mg, 1 comprimido...)">

        <input id="finalidadeMed" type="text" placeholder="Finalidade do tratamento">

        <input id="horarioMed" type="time">

        <select id="tipoFreq" onchange="toggleValorFreq()">
            <option value="">Frequência de uso</option>
            <option value="DIARIO">Diário</option>
            <option value="INTERVALO_HORAS">A cada X horas</option>
            <option value="SEMANAL">Semanal</option>
            <option value="MENSAL">Mensal</option>
        </select>
        <input id="valorFreq" type="number" placeholder="Ex: 6 (para 6 horas)" style="display:none;">    

        <div class="grupo-data">
            <label>Início do tratamento</label>
            <input id="dataInicioMed" type="date">
        </div>

        <div class="grupo-data">
            <label>Término do tratamento | término vazio para medicamentos de uso contínuo.</label>
            <input id="dataFimMed" type="date">            
        </div>

        <textarea
            id="obsMed"
            placeholder="Observações (tomar após refeição, evitar álcool...)"
        ></textarea>

        <button id="btnAddMed">
            Salvar Medicamento
        </button>

    </div>
    <div id="containerEdicao" style="display:none; border: 1px solid #ccc; padding: 15px; margin-bottom: 20px;">
        <h3>Confirme os dados antes de gerar os alarmes:</h3>
        <input id="editIdMed" type="hidden">
        
        <input id="editNome" type="text" placeholder="Nome">
        <input id="editDosagem" type="text" placeholder="Dosagem">
        <input id="editFinalidade" type="text" placeholder="Finalidade">
        <input id="editHorario" type="time">
        
        <select id="editTipoFreq">
            <option value="DIARIO">Diário</option>
            <option value="INTERVALO_HORAS">A cada X horas</option>
            <option value="SEMANAL">Semanal</option>
            <option value="MENSAL">Mensal</option>
        </select>
        
        <input id="editValorFreq" type="number" placeholder="Valor frequência (se aplicável)">
        <input id="editDataInicio" type="date">
        <input id="editDataFim" type="date">
        <textarea id="editObs" placeholder="Observações"></textarea>
        
        <button id="btnConfirmarImportacao" class="btn-confirmar">Confirmar e Gerar Alarmes</button>
        </div>
    <div id="listaMedicamentos" class="lista-meds"></div>

</div>
