<div class="medicamentos">

    <h2>Medicamentos</h2>

    <div class="form-med">

        <input id="nomeMed" type="text" placeholder="Nome do medicamento">

        <input id="horarioMed" type="time">

        <select id="tipoFreq">
            <option value="">Tipo</option>
            <option value="intervalo">De X em X horas</option>
            <option value="dias">Por X dias</option>
            <option value="semanal">Semanal</option>
            <option value="quinzenal">Quinzenal</option>
            <option value="mensal">Mensal</option>
        </select>

        <input id="valorFreq" type="number" placeholder="Valor">

        <button id="btnAddMed">
            Adicionar
        </button>

    </div>

    <div id="listaMedicamentos" class="lista-meds"></div>

</div>
